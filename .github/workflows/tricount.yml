name: Sincronizar Tricount

on:
  schedule:
    - cron: "17 4 * * *"   # cada día hacia las 5-6 de la mañana (hora de España)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Descargar Tricount
        env:
          TRICOUNT_IDS: ${{ secrets.TRICOUNT_IDS }}
        run: |
          git clone --depth 1 https://github.com/wenceslas-sanchez/tricount-extractor.git /tmp/tx
          # Si Tricount devuelve un error, mostrar su mensaje en el log (solo en caso de error)
          sed -i 's/response.raise_for_status()/(print("TRICOUNT DICE:", response.status_code, response.text[:500]) if response.is_error else None); response.raise_for_status()/' /tmp/tx/tricount_extractor/client/client.py
          cd /tmp/tx
          uv sync
          # Probar varias versiones de la app hasta que Tricount acepte una, y usar esa
          cat > /tmp/probar_version.py <<'EOF'
          import re, sys, uuid
          import httpx
          from tricount_extractor.client.keys import generate_public_rsa_key

          URL = "https://api.tricount.bunq.com/v1/session-registry-installation"
          clave = generate_public_rsa_key()
          candidatas = []
          for version in ["14.8.2", "14.0.3"]:
              for build in [500004145, 500004150, 500004155, 500004160, 500004165,
                            500004170, 500004180, 500004200, 500005000, 600000000]:
                  candidatas.append(f"com.bunq.tricount.android:RELEASE:{version}:{build}:ANDROID:13:C")

          for ua in candidatas:
              app = str(uuid.uuid4())
              r = httpx.post(
                  URL,
                  json={"app_installation_uuid": app, "client_public_key": clave, "device_description": "Android"},
                  headers={"User-Agent": ua, "app-id": app,
                           "X-Bunq-Client-Request-Id": str(uuid.uuid4()),
                           "Content-Type": "application/json"},
                  timeout=30,
              )
              print(r.status_code, ua)
              if r.status_code < 400:
                  ruta = "tricount_extractor/client/client.py"
                  codigo = open(ruta).read()
                  codigo = re.sub(r'USER_AGENT = ".*?"', f'USER_AGENT = "{ua}"',
