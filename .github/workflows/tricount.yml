name: Sincronizar Tricount

on:
  schedule:
    - cron: "17 4 * * *"   # cada día hacia las 5-6 de la mañana (hora de España)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Descargar Tricount
        env:
          TRICOUNT_IDS: ${{ secrets.TRICOUNT_IDS }}
        run: |
          git clone --depth 1 https://github.com/wenceslas-sanchez/tricount-extractor.git /tmp/tx
          # Hacerse pasar por la versión actual de la app (el extractor dice ser la 7.0.7)
          sed -i 's/RELEASE:7.0.7:/RELEASE:14.8.2:/' /tmp/tx/tricount_extractor/client/client.py
          # Si Tricount devuelve un error, mostrar su mensaje en el log (solo en caso de error)
          sed -i 's/response.raise_for_status()/(print("TRICOUNT DICE:", response.status_code, response.text[:500]) if response.is_error else None); response.raise_for_status()/' /tmp/tx/tricount_extractor/client/client.py
          cd /tmp/tx
          uv sync
          uv run tricount-extractor -id $TRICOUNT_IDS -f /tmp/out

      - name: Convertir y cifrar
        env:
          CLAVE: ${{ secrets.CLAVE_APP }}
        run: uv run --with openpyxl --with cryptography python scripts/tricount_a_json.py /tmp/out tricount.json

      - name: Guardar
        run: |
          git config user.name "tricount-sync"
          git config user.email "actions@users.noreply.github.com"
          git add tricount.json
          git diff --cached --quiet || (git commit -m "Sincronizar Tricount" && git push)
